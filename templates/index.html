<!DOCTYPE html>
<html>
<head>
    <title>Online Shop</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box {
            background: white;
            padding: 15px;
            margin: 10px;
            width: 280px;
            border-radius: 10px;
            box-shadow: 0 0 5px gray;
        }

        input {
            margin: 5px;
            padding: 5px;
            width: 90%;
        }

        button {
            margin-top: 10px;
            padding: 6px 10px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 10px;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>🛒 Online Shop Dashboard</h1>

<div class="container">

    <!-- ADD USER -->
    <div class="box">
        <h3>Add User</h3>
        <form action="/add_user" method="post">
            <input type="text" name="id" placeholder="User ID"><br>
            <input type="text" name="name" placeholder="Name"><br>
            <button>Add User</button>
        </form>
    </div>

    <!-- ADD ORDER -->
    <div class="box">
        <h3>Add Order</h3>
        <form action="/add_orders" method="post">
            <input type="text" name="order_id" placeholder="Order ID"><br>
            <input type="text" name="user_id" placeholder="User ID"><br>
            <input type="text" name="total" placeholder="Total"><br>
            <input type="text" name="status" placeholder="Status"><br>
            <button>Add Order</button>
        </form>
    </div>

    <!-- DELETE USER -->
    <div class="box">
        <h3>Delete User</h3>
        <form action="/delete_user" method="post">
            <input type="text" name="id" placeholder="User ID"><br>
            <button>Delete</button>
        </form>
    </div>

    <!-- UPDATE USER -->
    <div class="box">
        <h3>Update User</h3>
        <form action="/update_user" method="post">
            <input type="text" name="id" placeholder="User ID"><br>
            <input type="text" name="name" placeholder="New Name"><br>
            <button>Update</button>
        </form>
    </div>

</div>

<!-- LINKS -->
<h3>📊 Data</h3>
<a href="/show_users">View Users</a>
<a href="/show_orders">View Orders</a>

</body>
</html>
