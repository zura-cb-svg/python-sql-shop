<!DOCTYPE html>
<html>
<head>
    <title>Users</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 60%;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn {
            padding: 6px 10px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .delete {
            background-color: red;
        }

        .update {
            background-color: orange;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Users List</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user[0] }}</td>
        <td>{{ user[1] }}</td>

        <td>
            <!-- DELETE -->
            <form action="/delete_user" method="post" style="display:inline;">
                <input type="hidden" name="id" value="{{ user[0] }}">
                <button class="btn delete">Delete</button>
            </form>

            <!-- UPDATE -->
            <form action="/update_user" method="post" style="display:inline;">
                <input type="hidden" name="id" value="{{ user[0] }}">
                <input type="text" name="name" placeholder="New name">
                <button class="btn update">Update</button>
            </form>
        </td>
    </tr>
    {% endfor %}

</table>

<a href="/">⬅ Back to Home</a>

</body>
</html>
