<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #222;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .btn {
            padding: 6px 10px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .delete {
            background-color: red;
        }

        a {
            display: block;
            margin-top: 20px;
            font-size: 18px;
            text-decoration: none;
        }

        form {
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>Orders</h1>

<!-- 🔍 SEARCH -->
<h2>Search Orders</h2>
<form action="/search_orders" method="get">
    Status: <input type="text" name="status" placeholder="Pending / Shipped">
    <button type="submit">Search</button>
</form>

<!-- 📊 TABLE -->
<table>
    <tr>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order[0] }}</td>
        <td>{{ order[1] }}</td>
        <td>{{ order[2] }}</td>
        <td>{{ order[3] }}</td>

        <td>
            <form action="/delete_order" method="post">
                <input type="hidden" name="id" value="{{ order[0] }}">
                <button class="btn delete">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}

</table>

<a href="/">⬅ Back to Home</a>

</body>
</html>
